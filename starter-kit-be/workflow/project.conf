# Cấu hình workflow cho dự án này. Chủ dự án điền; agent đọc nhưng không sửa file này.
# Mỗi dòng: KHOÁ=giá trị, không có khoảng trắng quanh dấu "=".

# Nhánh chính: đích của MR và thước đo phạm vi tính năng, review (toàn bộ diff của nhánh so với đây). Ví dụ: main, develop.
BASE_BRANCH=main

# Nhánh làm việc (tuỳ chọn): nhánh bạn đang code, có thể đã đi trước BASE_BRANCH vài commit. Worktree của Coder,
# nhánh tích hợp và diff từng việc (kiểm "chỉ sửa file trong files:") tính từ đây; review vẫn đo so với BASE_BRANCH.
# Để trống thì dùng BASE_BRANCH. Ví dụ: BASE_BRANCH=develop, WORK_BRANCH=fix/route-rule.
WORK_BRANCH=

# Cách mở việc của một tính năng (SPEC.md ghi `mode:` thì theo SPEC):
#   parallel   : mọi việc được duyệt đều mở cùng lúc, Coder làm song song (mặc định).
#   sequential : chỉ một việc mở mỗi lúc; review xong và chủ dự án duyệt mới mở việc kế.
TASK_MODE=parallel

# Cách giao tính năng khi chủ dự án nói "đạt":
#   merge : Master gộp nhánh tích hợp vào BASE_BRANCH ở máy; chủ dự án push BASE_BRANCH (hoặc cho phép Master push).
#   mr    : nhánh tích hợp (tên <MR_PREFIX><tên-ngắn>) được push (chủ dự án tự push,
#           hoặc cho phép Master push), rồi chủ dự án mở
#           MR/PR vào BASE_BRANCH. Dùng khi team không cho commit thẳng lên nhánh chính.
DELIVERY=merge
# Tiền tố tên nhánh của tính năng: nhánh tích hợp <MR_PREFIX><tên-ngắn>, nhánh việc <MR_PREFIX><tên-ngắn>-tNN.
# Theo quy ước nhánh của dự án (ví dụ feature/, fix/).
MR_PREFIX=feature/

# File của workflow có lên git không:
#   yes : commit workflow/ cùng code (dự án riêng của bạn).
#   no  : chỉ để trên máy bạn (dự án của team). Xem README.md, mục "Chép vào dự án" (--local).
WORKFLOW_IN_GIT=yes
